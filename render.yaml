services:
  # main 배포(sunic-report-agent)와 별개로 뜨도록 이름을 분리한다.
  - type: web
    name: suni-c-4team-report-agent
    runtime: python
    plan: free
    branch: 수정본
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
